<!--

  v2.3.1: user ne EA v9.1+ hataya (v9.0 se nayi shuruaat) - v2.4.0 ke v9.1 wale badlav wapas: CHECK me lock
          chalu +$2 hi sahi, 'jodi -$2' setting nahi, version hint v9.0.

          equity line, seedhi chaal upar / neeche kis bhaav par kaunsa niyam (simulation). Har live update par badalta hai.
  v2.2.2: sudhar soochi me "level khali rehna" (EA v9.1 ke liye, haal: agle version me) ek baar apne aap.

          CHECK ki 🔴 / 🟡 line se ek click me jodo; haal: khula → agle version me → ho gaya (vX).
  v2.1.0: 🩺 CHECK tab (EA / MT5 haal, VPS Helper compile, setting jaanch, niyam ki chetavni, EA ki galti, HAAL log)
          + har tab ke upar 🟢 / 🟡 / 🔴 patti. MT5 khole bina sab jaanch.
  Pehle yahi repo GRID 2 (GridTrend S2) tha; wo account band, ab ye app S6 ke liye (purana code git history me).

<style>
:root{
  --pk:#ff4f9a; --pk2:#e91e63; --pk3:#c2185b; --pkS:#ffb3d4; --pkL:#ffe6f1; --pkXL:#fff4f9;
  --ink:#3b1a2e; --ink2:#5d3a4e; --mut:#9a7387; --line:rgba(233,30,99,.12);
  --g:#0e9f6e; --gL:#e3f7ef; --r:#d7263d; --rL:#fde6e9; --am:#d98200; --amL:#fff3dc;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--ink);font-size:14px;
  background:radial-gradient(900px 520px at -10% -8%,#ffd3e8 0%,rgba(255,211,232,0) 60%),radial-gradient(700px 460px at 110% 10%,#ffe9f3 0%,rgba(255,233,243,0) 60%),#fff7fb}
#app{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 110px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#ff7ab6,#e91e63 60%,#c2185b);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(233,30,99,.3);font-size:15px}
.tt{flex:1;min-width:0}.tt b{display:block;font-size:19px;letter-spacing:.5px}.tt small{color:var(--mut);font-size:11px}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:5px 10px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.pill.ok{color:var(--g);border-color:rgba(14,159,110,.35);background:var(--gL)}
.pill.bad{color:var(--r);border-color:rgba(215,38,61,.35);background:var(--rL)}
.pill.warn{color:var(--am);border-color:rgba(217,130,0,.35);background:var(--amL)}
.card{background:linear-gradient(180deg,#fff,#fff9fc);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(233,30,99,.07)}
.card h3{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--pk3);margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tiles.t3 .tile b{font-size:15px;white-space:nowrap}
.tile{border-radius:14px;padding:10px;background:var(--pkXL);border:1px solid var(--line)}
.tile small{display:block;font-size:10.5px;color:var(--mut);font-weight:600}
.tile b{display:block;font-size:18px;margin-top:2px}
.pos{color:var(--g)}.neg{color:var(--r)}
.hero{border-radius:22px;padding:16px;color:#fff;background:linear-gradient(140deg,#ff6fae,#e91e63 55%,#b0144f);box-shadow:0 12px 28px rgba(233,30,99,.35);margin-bottom:12px}
.hero.idle{background:linear-gradient(140deg,#c7a6b8,#8f6b7e)}
.hero .r1{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;opacity:.95}
.hero .dir{font-size:12px;font-weight:800;background:rgba(255,255,255,.22);border-radius:8px;padding:3px 9px}
.hero .big{font-size:40px;font-weight:800;line-height:1.1;margin:8px 0 2px}
.hero .sub{font-size:12.5px;opacity:.95}
.hero .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.hero .grid3 div{background:rgba(255,255,255,.16);border-radius:12px;padding:7px 6px;text-align:center;font-size:10.5px}
.hero .grid3 b{display:block;font-size:15px;margin-top:2px}
.bar{height:9px;border-radius:9px;background:var(--pkL);position:relative;overflow:hidden;margin-top:6px}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:9px;background:linear-gradient(90deg,#ff8dc0,#e91e63)}
.bar.g i{background:linear-gradient(90deg,#46d39a,#0e9f6e)}.bar.r i{background:linear-gradient(90deg,#ff8a95,#d7263d)}
.bl{display:flex;justify-content:space-between;font-size:12px;margin-top:10px}
.bl b{font-weight:700}
.lad{display:flex;flex-direction:column;gap:6px}
.lv{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;border-radius:14px;padding:9px 10px;border:1px solid var(--line);background:#fff}
.lv .n{font-weight:800;color:var(--pk3);font-size:13px}
.lv .p{font-family:var(--mono);font-size:14px;font-weight:700}
.lv .p small{display:block;font-family:Poppins;font-size:10.5px;color:var(--mut);font-weight:500}
.lv .s{font-size:11px;font-weight:800;border-radius:8px;padding:4px 8px;text-align:center;min-width:76px}
.lv.open{border-color:rgba(14,159,110,.4);background:var(--gL)}.lv.open .s{background:var(--g);color:#fff}
.lv.pend{border-color:rgba(217,130,0,.4);background:var(--amL)}.lv.pend .s{background:var(--am);color:#fff}
.lv.empty .s{background:#f1e6ec;color:var(--mut)}
.lv.main{border:2px solid var(--pk);background:var(--pkL)}.lv.main .s{background:var(--pk2);color:#fff}
.now{text-align:center;font-size:11.5px;font-weight:800;color:var(--pk2);padding:2px 0}
.now::before,.now::after{content:'';display:inline-block;width:30%;height:1px;background:var(--pkS);vertical-align:middle;margin:0 8px}
.ev{display:flex;gap:8px;font-size:12px;padding:7px 0;border-top:1px solid var(--line);line-height:1.45}
.ev:first-child{border-top:0}.ev .t{color:var(--mut);font-family:var(--mono);font-size:11px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:600;font-size:10.5px}
td:first-child,th:first-child{text-align:left}
.res{font-size:10.5px;font-weight:800;border-radius:7px;padding:2px 6px;background:var(--pkL);color:var(--pk3)}
.res.SL{background:var(--rL);color:var(--r)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-weight:700;font-family:inherit}
.seg button.on{background:linear-gradient(135deg,#ff7ab6,#e91e63);color:#fff;border-color:transparent}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}
label small{display:block;font-weight:500;color:var(--mut)}
input{width:100%;height:44px;border-radius:12px;border:1px solid var(--pkS);padding:0 12px;font-family:var(--mono);font-size:13px;background:#fff;color:var(--ink)}
.btn{height:46px;border-radius:14px;border:0;font-weight:800;font-family:inherit;font-size:14px;padding:0 16px;cursor:pointer}
.btn.pk{background:linear-gradient(135deg,#ff7ab6,#e91e63);color:#fff;box-shadow:0 8px 18px rgba(233,30,99,.3)}
.btn.gh{background:#fff;border:1px solid var(--pkS);color:var(--pk3)}
.btns{display:flex;gap:8px;margin-top:14px}.btns .btn{flex:1}
.note{font-size:12px;color:var(--mut);line-height:1.6}
.empty{text-align:center;padding:26px 10px;color:var(--mut);font-size:13px;line-height:1.7}
.demo{background:var(--amL);color:var(--am);border:1px solid rgba(217,130,0,.35);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:700;margin-bottom:10px;text-align:center}
nav.bn{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:rgba(255,247,251,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
nav.bn button{border:0;background:transparent;color:var(--mut);font-family:inherit;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px}
nav.bn button b{font-size:18px;font-weight:400}
nav.bn button.on{color:var(--pk2);background:var(--pkL)}
.ban{display:flex;align-items:center;gap:8px;border-radius:14px;padding:9px 12px;font-size:12.5px;font-weight:800;margin-bottom:10px;cursor:pointer;border:1px solid}
.ban.g{background:var(--gL);color:var(--g);border-color:rgba(14,159,110,.3)}
.ban.y{background:var(--amL);color:var(--am);border-color:rgba(217,130,0,.35)}
.ban.r{background:var(--rL);color:var(--r);border-color:rgba(215,38,61,.35)}
.ban span{flex:1}
.ck{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;line-height:1.45}
.ck:first-of-type{border-top:0}.ck b{font-weight:700}.ck small{display:block;color:var(--mut);font-size:11px;word-break:break-word}
.ck.r b{color:var(--r)}.ck.y b{color:var(--am)}
td.bad{color:var(--r);font-weight:800}td.okc{color:var(--g)}
.lg{font-family:var(--mono);font-size:11px;line-height:1.55;white-space:nowrap;overflow-x:auto}
.lg div{padding:2px 0;border-top:1px dashed var(--line)}
textarea{width:100%;min-height:70px;border-radius:12px;border:1px solid var(--pkS);padding:10px 12px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink);resize:vertical}
.nt{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:start;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;line-height:1.5}
.nt:first-of-type{border-top:0}.nt small{display:block;color:var(--mut);font-size:10.5px}
.nt.done .m{text-decoration:line-through;color:var(--mut)}
.chip{font-size:10.5px;font-weight:800;border-radius:8px;padding:3px 7px;border:0;font-family:inherit;white-space:nowrap;cursor:pointer}
.chip.open{background:var(--rL);color:var(--r)}.chip.next{background:var(--amL);color:var(--am)}.chip.done{background:var(--gL);color:var(--g)}
.chip.del{background:#f1e6ec;color:var(--mut);margin-top:4px;display:block;width:100%}
.addn{font-size:10.5px;font-weight:800;border:1px solid var(--pkS);background:#fff;color:var(--pk3);border-radius:8px;padding:2px 7px;margin-top:4px;cursor:pointer;font-family:inherit}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-size:12.5px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">S6</div>
    <div class="tt"><b>S6 LIVE</b><small>PERSONAL FX · Strategy 6 · Hedge ladder</small></div>
    <span class="pill" id="st">…</span>
  </header>
  <div id="main"></div>
</div>
<nav class="bn" id="nav"></nav>
<div id="toast"></div>
<script>
'use strict';
const VER='2.3.1';
const DEF_FB='https://forexdiagnosis-default-rtdb.asia-southeast1.firebasedatabase.app';
const LS='s6live_cfg', LSC='s6live_cache';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=v=>(v==null||isNaN(v))?'—':(v>=0?'+$':'−$')+Math.abs(+v).toFixed(2);
const usd0=v=>(v==null||isNaN(v))?'—':'$'+(+v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cls=v=>v>0?'pos':v<0?'neg':'';
const IST={timeZone:'Asia/Kolkata'};
const hm=t=>new Date(t).toLocaleTimeString('en-GB',{...IST,hour:'2-digit',minute:'2-digit',hour12:false});
const dm=t=>new Date(t).toLocaleDateString('en-GB',{...IST,day:'2-digit',month:'short'});
const dayKey=t=>new Date(t).toLocaleDateString('en-CA',IST);
const ago=t=>{const s=Math.round((Date.now()-t)/1000);return s<60?s+' sec':s<3600?Math.round(s/60)+' min':Math.round(s/3600)+' घंटे'};
const dur=ms=>{const m=Math.round(ms/60000);return m<60?m+' min':Math.floor(m/60)+'h '+(m%60)+'m'};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}

let CFG={fb:DEF_FB,auth:'',key:'s6',sec:3,tab:'live'};
try{Object.assign(CFG,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
const DEMO=/[?&]demo=1/.test(location.search);
function saveCfg(){try{localStorage.setItem(LS,JSON.stringify(CFG))}catch(e){}}
const ST={hb:null,live:{},events:[],cycles:[],err:'',at:0,evAt:0,vps:null,vpsAt:0,vpsErr:'',hit:{},notes:null,nf:'open'};
try{const c=JSON.parse(localStorage.getItem(LSC)||'null');if(c&&c.key===CFG.key){ST.hb=c.hb;ST.live=c.live||{};ST.events=c.events||[];ST.cycles=c.cycles||[];ST.notes=c.notes||null}}catch(e){}

function base(){let u=String(CFG.fb||'').trim().replace(/\/+$/,'');if(u&&!/^https?:\/\//.test(u))u='https://'+u;return u}
function url(path,q){const k=String(CFG.key||'s6').replace(/[.$#\[\]\/ ]/g,'_');
  let u=base()+'/personalfx/s6live/'+k+'/'+path+'.json';const p=[];if(CFG.auth)p.push('auth='+encodeURIComponent(CFG.auth));if(q)p.push(q);return p.length?u+'?'+p.join('&'):u}
async function getRaw(path){let u=base()+'/'+path+'.json';if(CFG.auth)u+='?auth='+encodeURIComponent(CFG.auth);
  const r=await fetch(u,{cache:'no-store'});if(r.status===401||r.status===403)throw new Error('PERM');if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function send(path,method,obj){const r=await fetch(url(path),{method,body:obj==null?undefined:JSON.stringify(obj)});
  if(r.status===401||r.status===403)throw new Error('PERM');if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function get(path,q){const r=await fetch(url(path,q),{cache:'no-store'});if(r.status===401||r.status===403)throw new Error('PERM');if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}

/* ---------- demo data (?demo=1) ---------- */
function demoData(){
  const now=Date.now(),o=3571.48,b=3559.2;
  ST.hb={at:now,v:'9.0',strat:6,ta:true,ea:true,conn:true,ping:38,ml:2490.5,fm:4768.3,liveOn:true,push:5,manual:true,bal:4980.85,eq:4968.1,cur:'USD',demo:true,
    cfg:{tp:3,gap:3,hlot:0.01,basket:5,cycle:3,net:6,sl:60,lock:1,arm:2,ahead:5},
    errs:[{t:now-42*60e3,m:'pending FAIL level 6 XAUUSDm @ 3553.480 [10016] Invalid stops'},{t:now-3*3600e3,m:'Firebase WebRequest error 5203'}],
    haal:Array.from({length:30},(_,i)=>({t:now-i*10e3,s:'XAUUSDm',o:+(-6.4+i*0.11).toFixed(2),b:2.1,n:+(-4.3+i*0.11).toFixed(2),h:4}))};
  ST.vps={v:'1.07',at:Math.round(now/1000)-70,commit:'303971f',err:'',terms:[{name:'MetaTrader 5 EXNESS',run:true,files:[{f:'PERSONAL FX v9.0 - GRID.mq5',ok:true,ne:0,nw:2,at:Math.round(now/1000)-300,msg:['0 errors, 2 warnings']}]}]};
  ST.live={XAUUSDm:{at:now,state:'RUN',sym:'XAUUSDm',dg:3,dir:'BUY',lot:0.02,open:o,tp:0,bid:b,ask:b+0.2,sp:0.2,gapPx:3,mpl:(b-o)*2,
    hedges:[{n:1,o:3568.48,pl:9.08,lot:0.01,a:1},{n:2,o:3565.48,pl:6.08,lot:0.01,a:1},{n:3,o:3562.48,pl:3.08,lot:0.01,a:1},{n:4,o:3559.48,pl:0.08,lot:0.01,a:0}],
    pend:[{n:5,p:3556.48},{n:6,p:3553.48},{n:7,p:3550.48},{n:8,p:3547.48},{n:9,p:3544.48}],banked:2.1,start:now-54*60000,nh:4,used:6,dd:-14.2,bal:4980.85,eq:4968.1}};
  const L=ST.live.XAUUSDm;L.hpl=L.hedges.reduce((a,h)=>a+h.pl,0);L.tot=L.mpl+L.hpl;L.net=L.tot+L.banked;
  ST.events=[[now-60e3,'PERSONAL FX S6: HEDGE level 4 XAUUSDm SELL 0.01 @ 3559.480 | khule hedge 4 | sab milake $-6.40'],[now-9*60e3,'PERSONAL FX S6: LOCK XAUUSDm | 1 hedge band +$0.96 | baaki 3 hedge'],[now-54*60e3,'PERSONAL FX S6: naya cycle XAUUSDm BUY 0.02 @ 3571.480']].map(([t,m])=>({t,m}));
  const res=['TP','NET +$6','CYCLE TP +$3.12','BASKET TP +$5.04','TP','NET +$6','BASKET SL -$60.20'];
  ST.cycles=res.map((r,i)=>({start:now-(i+2)*3.1e6,end:now-(i+2)*3.1e6+2.2e6,sym:'XAUUSDm',dir:i%2?'SELL':'BUY',lot:0.02,open:3570-i*4,res:r,pl:r.includes('SL')?-60.2:r==='TP'?6:+(5+Math.random()).toFixed(2),dd:-(5+i*4),hedges:i}));
}

async function load(full){
  if(DEMO){demoData();if(!ST.notes){ST.notes={};SEED.concat(SEED2,SEED3).forEach((x,i)=>ST.notes[x[0]]=seedObj(x,i*60))}
    ST.err='';ST.at=Date.now();trackHits();render();return}
  if(!base()){ST.err='Firebase URL नहीं';render();return}
  try{
    const [hb,live]=await Promise.all([get('hb'),get('live')]);
    ST.hb=hb;ST.live=live||{};ST.err='';ST.at=Date.now();trackHits();
    if(full||Date.now()-ST.evAt>15000){
      ST.evAt=Date.now();
      const [ev,cy]=await Promise.all([get('events','orderBy=%22$key%22&limitToLast=80'),get('cycles','orderBy=%22$key%22&limitToLast=400')]);
      ST.events=Object.values(ev||{}).sort((a,b)=>b.t-a.t);
      ST.cycles=Object.values(cy||{}).sort((a,b)=>b.end-a.end);
      try{ST.notes=await get('notes')||{};await seedNotes()}catch(e){}
    }
    if(full||Date.now()-ST.vpsAt>60000){
      ST.vpsAt=Date.now();
      try{ST.vps=await getRaw('copytrade/vps');ST.vpsErr=''}catch(e){ST.vpsErr=e.message}
    }

/* ---------- v2.3.0: 🔮 AAGE KA ANDAAZA ----------
   Equity: cycle shuru balance B0 = balance − pakka. Net: eq ≥ B0+net · Basket: eq ≥ bal+basket (main ghate me)
   · Cycle: eq ≥ bal+cycle (main faayde me) · SL: eq ≤ bal−sl. Har +$1 pakka par bal / SL / basket / cycle line $1 upar.
   Bhaav: seedhi chaal (upar / neeche) ka simulation - pending bharte hain (aage naye level bhi), armed hedge
   +lock par band (sirf sabse gehra - LIFO), jodi (gehre 2) +lock par, phir EA ke niyam. Spread / slippage / chop nahi. */
function simMove(L,c,s){                 // s = +1 bhaav upar, -1 neeche
  const gapPx=+L.gapPx||c.gap,K=c.gap/(0.01*gapPx),dm=L.dir==='BUY'?1:-1,dh=-dm,hl=c.hlot||0.01;
  const P0=((+L.bid)+(+L.ask))/2,step=gapPx/60,lockF=l=>c.lock*(l/0.01),armF=l=>Math.max(c.lock,c.arm)*(l/0.01);
  const tpUsd=c.tp*(L.lot/0.01);
  let H=(L.hedges||[]).map(h=>({o:+h.o,lot:+h.lot||hl,pl0:+h.pl,P0,a:!!h.a})),banked=+L.banked||0,pairA=false;
  const used=new Set(H.map(h=>h.o.toFixed(2)));
  let pend=(L.pend||[]).map(x=>({n:+x.n,p:+x.p}));
  const maxN=Math.max(0,...pend.map(x=>x.n),...(L.hedges||[]).map(h=>+h.n||0));
  for(let n=maxN+1;n<=maxN+60;n++)pend.push({n,p:+L.open+dh*n*gapPx});      // aage ke naye level (EA "ahead" bharta rehta hai)
  const plH=(h,P)=>h.pl0+dh*(P-h.P0)*h.lot*K, mpl=P=>(+L.mpl)+dm*(P-P0)*L.lot*K;
  const depth=h=>dh*(h.o-L.open);       // main se doori (bada = gehra)
  let worst=Infinity,worstP=P0;
  for(let i=1;i<=2400;i++){
    const P=P0+s*i*step;
    // pending bhare (STOP: hedge ki disha me bhaav paar)
    pend=pend.filter(x=>{if(dh>0?P>=x.p:P<=x.p){H.push({o:x.p,lot:hl,pl0:0,P0:x.p,a:false});
      if(H.length>=2){H.sort((a,b)=>depth(a)-depth(b));const d1=H[H.length-1],d2=H[H.length-2];if(plH(d1,P)+plH(d2,P)>lockF(d1.lot))pairA=true}
      return false}return true});
    H.sort((a,b)=>depth(a)-depth(b));
    H.forEach(h=>{if(!h.a&&plH(h,P)>=armF(h.lot))h.a=true});
    // lock: sirf sabse gehra (LIFO)
    for(let g=0;g<200&&H.length;g++){
      const d1=H[H.length-1],p1=plH(d1,P);
      if(d1.a&&p1<=lockF(d1.lot)){banked+=p1;H.pop();pairA=false;continue}
      if(!d1.a&&H.length>=2){const d2=H[H.length-2],cb=p1+plH(d2,P);if(cb>lockF(d1.lot))pairA=true;
        if(pairA&&cb<=lockF(d1.lot)){banked+=cb;H.pop();H.pop();pairA=false;continue}}
      break}
    const m=mpl(P),tot=m+H.reduce((a,h)=>a+plH(h,P),0),net=banked+tot;
    if(tot<worst){worst=tot;worstP=P}
    const done=(why)=>({P,why,res:net,tot,banked,worst,worstP,nh:H.length});
    if(c.net>0&&net>=c.net)return done('NET +$'+c.net);
    if(!H.length){if(tpUsd>0&&m>=tpUsd)return done('MAIN TP')}
    else{const need=m>=0?c.cycle:c.basket;if(need>0&&tot>=need)return done((m>=0?'CYCLE':'BASKET')+' TP');
      if(c.sl>0&&tot<=-c.sl)return done('BASKET SL')}
  }
  return {P:null,worst,worstP};
}
function vAage(L){
  const c=cfgOf(),h=ST.hb||{},dg=L.dg||2;
  const bal=+(L.bal!=null?L.bal:h.bal),eq=+(L.eq!=null?L.eq:h.eq);
  if(!isFinite(bal)||!isFinite(eq))return '';
  const banked=+L.banked||0,B0=bal-banked,mainLoss=L.mpl<0;
  const T=[];
  if(c.net>0)T.push(['Net (शुरू balance + $'+c.net+')',B0+c.net]);
  if(!L.nh)T.push(['Main TP',bal+c.tp*(L.lot/0.01)]);
  else T.push(mainLoss?['Basket (balance + $'+c.basket+')',bal+c.basket]:['Cycle (balance + $'+c.cycle+')',bal+c.cycle]);
  const first=T.reduce((a,b)=>b[1]<a[1]?b:a),left=first[1]-eq;
  const slE=c.sl>0&&L.nh?bal-c.sl:null;
  const pr=Math.max(0,Math.min(100,(eq-(slE!=null?slE:eq-20))/((first[1])-(slE!=null?slE:eq-20))*100));
  const row=(ic,r,dir)=>{if(!r||r.P==null)return `<div class="bl"><span>${ic} सीधा ${dir}</span><b>${40}× gap तक कुछ नहीं</b></div>`;
    const sl=/SL/.test(r.why),eqAt=B0+r.res;
    return `<div class="bl"><span>${ic} सीधा ${dir} ~<b class="mono">${r.P.toFixed(dg)}</b></span><b class="${sl?'neg':'pos'}">${r.why} · ${usd(r.res)}</b></div>
      <div class="note">equity ~${usd0(eqAt)} · रास्ते में सबसे बुरा खुले ${usd(Math.min(r.worst,L.tot))} (~${r.worstP.toFixed(dg)})</div>`};
  let up=null,dn=null;try{up=simMove(L,c,1);dn=simMove(L,c,-1)}catch(e){}
  const slTxt=c.sl>0?([up,dn].some(r=>r&&r.why==='BASKET SL')?'सीधी चाल में लग सकता है — ऊपर देखो':'सीधी चाल में नहीं लगेगा — सिर्फ़ ऊपर-नीचे (chop) में'):'';
  return `<div class="card"><h3>🔮 आगे का अंदाज़ा</h3>
    <div class="tiles t3"><div class="tile"><small>शुरू balance</small><b class="mono">${usd0(B0)}</b></div>
    <div class="tile"><small>पक्का</small><b class="mono ${cls(banked)}">${usd(banked)}</b></div>
    <div class="tile"><small>खुले</small><b class="mono ${cls(L.tot)}">${usd(L.tot)}</b></div></div>
    <div class="bl"><span>🎯 Cycle बंद: equity ≈</span><b class="mono pos">${usd0(first[1])}</b></div>
    <div class="note">${esc(first[0])} · अभी ${usd0(eq)} · <b>${left>0?'$'+left.toFixed(2)+' बाकी':'पहुँच गया'}</b></div>
    <div class="bar g"><i style="width:${pr}%"></i></div>
    ${T.length>1?`<div class="note" style="margin-top:4px">${T.map(t=>esc(t[0])+': '+usd0(t[1])).join(' · ')}</div>`:''}
    <div class="bl"><span>🛑 Basket SL: equity ≤</span><b class="mono neg">${slE!=null?usd0(slE):(c.sl>0?'(hedge खुलने पर)':'OFF')}</b></div>
    ${slE!=null?`<div class="note">अभी से $${(eq-slE).toFixed(2)} दूर · हर +$1 पक्का पर ये लाइन $1 ऊपर · ${slTxt}</div>`:''}
    <div style="margin-top:6px">${row('⬆️',up,'ऊपर')}${row('⬇️',dn,'नीचे')}</div>
    <div class="note" style="margin-top:6px">अंदाज़ा: pending भरना, lock, जोड़ी और EA के नियम गिने हैं; spread / slippage / बीच की हलचल नहीं — असली भाव 1–2 point आगे-पीछे। हर ~5 sec बदलता है।</div></div>`;
}

  else{bars=prog('Net (पक्का + खुले) → cycle बंद',L.net,c.net,'g')+(mainLoss?prog('Basket (main घाटे में) → सब बंद',L.tot,c.basket):prog('Cycle (main फ़ायदे में) → सब बंद',L.tot,c.cycle))

function vLadder(){
  const R=runs();
  if(!R.length)return `<div class="card"><div class="empty">🪜 सीढ़ी तभी दिखेगी जब cycle चल रहा हो।<br>Main trade लेते ही यहाँ हर level दिखेगा।</div></div>`;
  return R.map(L=>{
    const dg=L.dg||2,d=L.dir==='BUY'?-1:1,gap=+L.gapPx||cfgOf().gap,price=L.dir==='BUY'?L.bid:L.ask;
    const H={},P={};(L.hedges||[]).forEach(x=>(H[x.n]=H[x.n]||[]).push(x));(L.pend||[]).forEach(x=>P[x.n]=x);
    const maxN=Math.max(5,...Object.keys(H).map(Number),...Object.keys(P).map(Number));
    const rows=[];
    rows.push({px:L.open,html:`<div class="lv main"><span class="n">MAIN</span><span class="p">${(+L.open).toFixed(dg)}<small>${L.dir} ${(+L.lot).toFixed(2)} · ${usd(L.mpl)}</small></span><span class="s">${L.dir}</span></div>`});
    for(let n=1;n<=maxN;n++){
      const lvPx=L.open+d*n*gap;
      if(H[n])H[n].forEach(x=>rows.push({px:x.o,html:`<div class="lv open"><span class="n">#${n}</span><span class="p">${(+x.o).toFixed(dg)}<small>${L.dir==='BUY'?'SELL':'BUY'} ${(+x.lot).toFixed(2)} · <b class="${cls(x.pl)}">${usd(x.pl)}</b> · ${x.a?'🔒 lock चालू (+$'+cfgOf().lock+' पर बंद)':'lock अभी नहीं (+$'+cfgOf().arm+' पर)'}</small></span><span class="s">खुला</span></div>`}));
      else if(P[n])rows.push({px:P[n].p,html:`<div class="lv pend"><span class="n">#${n}</span><span class="p">${(+P[n].p).toFixed(dg)}<small>${L.dir==='BUY'?'SELL':'BUY'} STOP pending${Math.abs(P[n].p-lvPx)>gap*0.05?' · level '+lvPx.toFixed(dg)+' से पहले (बंद हुए भाव पर)':''}</small></span><span class="s">PENDING</span></div>`});
      else rows.push({px:lvPx,html:`<div class="lv empty"><span class="n">#${n}</span><span class="p">${lvPx.toFixed(dg)}<small>खाली — भाव level से वापस लौटे तो pending लगेगा</small></span><span class="s">खाली</span></div>`});
    }
    rows.sort((a,b)=>d<0?b.px-a.px:a.px-b.px);
    let out='',put=false;
    rows.forEach(r=>{if(!put&&(d<0?r.px<price:r.px>price)){out+=`<div class="now">अभी ${(+price).toFixed(dg)}</div>`;put=true}out+=r.html});
    if(!put)out+=`<div class="now">अभी ${(+price).toFixed(dg)}</div>`;
    return `<div class="card"><h3>${esc(L.sym)} · हर $${cfgOf().gap} पर hedge</h3><div class="lad">${out}</div>
      <div class="note" style="margin-top:8px">🟢 खुला · 🟡 pending (broker पर) · ⚪ खाली · बंद सबसे नीचे वाले से, +$${cfgOf().arm} के बाद +$${cfgOf().lock} पर</div></div>`;
  }).join('');
}

const WANT={strat:[6,'Strategy'],sl:[60,'Basket SL $'],arm:[2,'Lock चालू (+$)'],lock:[1,'Lock बंद (+$)'],ahead:[5,'Pending आगे'],net:[6,'Net (पक्का+खुले) $'],
  tp:[3,'Main TP $ / 0.01'],gap:[3,'Gap $'],hlot:[0.01,'Hedge lot'],basket:[5,'Basket TP $'],cycle:[3,'Cycle TP $']};
function ruleOf(L,c){
  if(c.net>0&&L.net>=c.net)return 'Net '+usd(L.net)+' ≥ +$'+c.net;
  if(!L.nh){const t=c.tp*(L.lot/0.01);return t>0&&L.mpl>=t?'Main TP '+usd(L.mpl)+' ≥ +$'+t:''}
  const need=L.mpl>=0?c.cycle:c.basket;
  if(need>0&&L.tot>=need)return (L.mpl>=0?'Cycle':'Basket')+' '+usd(L.tot)+' ≥ +$'+need;
  if(c.sl>0&&L.tot<=-c.sl)return 'Basket SL '+usd(L.tot)+' ≤ −$'+c.sl;
  return '';
}
function trackHits(){            // niyam poora hua par 2 lagatar snapshot (~5 sec) me bhi cycle chal raha -> 🔴
  const c=cfgOf(),seen={};
  runs().forEach(L=>{seen[L.sym]=1;const r=ruleOf(L,c),H=ST.hit[L.sym];
    if(!r){delete ST.hit[L.sym];return}
    if(!H||H.start!==L.start)ST.hit[L.sym]={start:L.start,first:L.at,last:L.at,r};else{H.last=L.at;H.r=r}});
  Object.keys(ST.hit).forEach(k=>{if(!seen[k])delete ST.hit[k]});
}
function vpsFiles(){             // har terminal me sabse naya PERSONAL FX file ka compile nateeja
  const v=ST.vps;if(!v||!Array.isArray(v.terms))return [];
  const ver=f=>{const m=/PERSONAL FX v(\d+)\.(\d+)/.exec(f||'');return m?(+m[1])*100+(+m[2]):-1};
  const out=[];
  v.terms.forEach(t=>{const fs=(t.files||[]).filter(x=>ver(x.f)>=0);if(!fs.length)return;
    const top=fs.reduce((a,b)=>ver(b.f)>ver(a.f)?b:a);out.push({term:t.name||'terminal',run:t.run,file:top})});
  return out;
}

  // C: niyam / ladder

    for(let i=0;i<H.length;i++)for(let j=i+1;j<H.length;j++)if(Math.abs(H[i].o-H[j].o)<gap*0.5)

      const a=dd[0],b=dd[1];if(a.pl<0&&b.pl<0&&!a.a)add('y','C',sym+': सबसे नीचे की जोड़ी घाटे में (#'+a.n+' '+usd(a.pl)+', #'+b.n+' '+usd(b.pl)+')','lock अभी नहीं — भाव वापस आने का इंतज़ार')}

  catch(e){if(old)ST.notes[id]=old;else delete ST.notes[id];render();toast(e.message==='PERM'?'सेव नहीं — Auth जाँचो':'सेव नहीं: '+e.message);return false}
}
function noteAdd(k,m,src){
  m=String(m||'').trim().slice(0,500);if(!m){toast('पहले लिखो');return}
  const same=Object.values(ST.notes||{}).find(x=>x.st!=='done'&&x.m===m);if(same){toast('ये पहले से सूची में है');return}
  noteSave('n'+Date.now(),{t:Date.now(),k,m,st:'open',ver:'',src:src||'haath'}).then(ok=>{if(ok){toast('सूची में जुड़ गया ✓');const t=$('nTxt');if(t&&src!=='check')t.value=''}});
}
function noteFromDiag(i){const x=LASTD[i];if(!x)return;const tx=s=>String(s).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  noteAdd(x.l==='r'?'r':'y',tx(x.t)+(x.d?' — '+tx(x.d):'')+' ('+dm(Date.now())+' '+hm(Date.now())+')','check')}
function noteStep(id){const n=ST.notes&&ST.notes[id];if(!n)return;
  const st=n.st==='open'?'next':n.st==='next'?'done':'open';let ver=n.ver||'';
  if(st==='done'){const v=prompt('किस version में ठीक हुआ? (जैसे EA v9.1 / app v2.3.0)',ST.hb&&ST.hb.v?'EA v'+ST.hb.v:'');if(v===null)return;ver=String(v).trim().slice(0,40)}
  if(st==='open')ver='';
  noteSave(id,Object.assign({},n,{st,ver,at:Date.now()}))}
function noteDel(id){if(confirm('ये point हटाना है?'))noteSave(id,null)}
function vNotes(){
  const all=Object.entries(ST.notes||{}).map(([id,n])=>Object.assign({id},n)).sort((a,b)=>({open:0,next:1,done:2}[a.st]||0)-({open:0,next:1,done:2}[b.st]||0)||b.t-a.t);
  const cnt=st=>all.filter(x=>x.st===st).length,list=ST.nf==='all'?all:all.filter(x=>x.st!=='done');
  return `<div class="card" id="notes"><h3>📝 सुधार सूची · ${cnt('open')} खुले · ${cnt('next')} अगले version में · ${cnt('done')} हो गए</h3>
    <div class="seg">${[['r','🔴 गड़बड़'],['y','🟡 मिसमैच'],['i','💡 सुधार']].map(([k,l])=>`<button class="${NKIND===k?'on':''}" onclick="NKIND='${k}';render()">${l}</button>`).join('')}</div>
    <textarea id="nTxt" placeholder="क्या गड़बड़ / क्या मेल नहीं खा रहा / क्या सुधार चाहिए…"></textarea>
    <div class="btns" style="margin-top:8px"><button class="btn pk" onclick="noteAdd(NKIND,$('nTxt').value,'haath')">सूची में जोड़ो</button></div>
    <div class="seg" style="margin-top:12px">${[['open','खुले + अगले'],['all','सब (हो गए भी)']].map(([k,l])=>`<button class="${ST.nf===k?'on':''}" onclick="ST.nf='${k}';render()">${l}</button>`).join('')}</div>
    ${list.length?list.map(n=>`<div class="nt ${n.st}"><span>${(NK[n.k]||NK.i)[0]}</span><div><span class="m">${esc(n.m)}</span>
      <small>${(NK[n.k]||NK.i)[1]} · ${dm(n.t)} ${hm(n.t)}${n.src==='check'?' · CHECK से':n.src==='shuru'?' · शुरुआती सूची':''}${n.st==='done'&&n.ver?' · ठीक हुआ: '+esc(n.ver):''}</small></div>
      <div><button class="chip ${n.st}" onclick="noteStep('${n.id}')">${NS[n.st]||n.st}</button><button class="chip del" onclick="noteDel('${n.id}')">हटाओ</button></div></div>`).join('')
      :'<div class="empty">कोई point नहीं</div>'}
    <div class="note" style="margin-top:8px">हाल बदलने के लिए बटन दबाओ: खुला → अगले version में → हो गया। Firebase में सेव होता है, नया version बनाते समय यही सूची देखी जाएगी।</div></div>`;
}
const TABS=[['live','📡','LIVE'],['ladder','🪜','LADDER'],['risk','⚠️','RISK'],['history','📜','HISTORY'],['check','🩺','CHECK'],['setup','⚙️','SETUP']];
function render(){
  status();
  const ae=document.activeElement;if(ae&&ae.id==='nTxt'&&CFG.tab==='check')return;   // likhte waqt dobara na banao
  $('nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${CFG.tab===k?'on':''}" onclick="CFG.tab='${k}';saveCfg();render()"><b>${i}</b>${l}</button>`).join('');
  let h=DEMO?'<div class="demo">DEMO — नकली data (असली के लिए SETUP)</div>':'';
  if(!DEMO&&CFG.tab!=='setup'){
    if(ST.err==='PERM')h+=`<div class="card"><div class="empty">🔐 Firebase ने मना किया — SETUP में <b>Firebase Auth</b> डालो।</div></div>`;
    else if(ST.err&&!ST.hb)h+=`<div class="card"><div class="empty">⚠️ ${esc(ST.err)}</div></div>`;
    else if(!ST.hb)h+=`<div class="card"><div class="empty">EA का data अभी नहीं आया।<br>PERSONAL FX v9.0 (Strategy 6, S6_LiveOn = true) चालू करो।<br>SETUP में key "${esc(CFG.key)}" जाँचो।</div></div>`;
  }
  if(CFG.tab!=='setup')h+=banner();
  h+=({live:vLive,ladder:vLadder,risk:vRisk,history:vHistory,check:vCheck,setup:vSetup}[CFG.tab]||vLive)();
  $('main').innerHTML=h;
}
let timer=null;
function restart(){clearInterval(timer);timer=setInterval(()=>{if(!document.hidden&&CFG.tab!=='setup')load(false)},Math.max(2,CFG.sec)*1000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(true)});
render();load(true);restart();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
